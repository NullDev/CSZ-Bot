name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-slim", "windows-latest", "macos-latest"]

    name: Lint
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: true
      - run: npm run ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest

    needs: lint

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.tag.outputs.first }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/nulldev/csz-bot
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract tag
        id: tag
        env:
          INPUT_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first=$(echo "$INPUT_TAGS" | head -n 1)

          echo "first=$first" >> "$GITHUB_OUTPUT"

      - name: Build and export
        uses: docker/build-push-action@v7
        id: build
        with:
          # context needed, so we use path context instead of git context, so .dockerignore is respected
          context: "."
          push: ${{ !github.event.repository.fork }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_IDENTIFIER=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            YTDLP_CACHE_BUST=${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-e2e:
    name: Deploy e2e
    runs-on: ubuntu-latest

    # Forks and Dependabot don't get the SSH secrets
    if: ${{ !github.event.repository.fork && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}

    needs: [build]

    concurrency: e2e
    environment:
      name: e2e

    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Update configuration
        env:
          DISCORD_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.CI_CLIENT_ID }}
          PR_ID: ${{ github.event.number }}
        run: |
          envsubst < .github/config.json > config-ephemeral.json

      - name: Build args
        id: args
        env:
          DRY_RUN: ${{ github.ref == 'refs/heads/master' }}
        run: |
          args=""

          if [[ $DRY_RUN = true ]]; then
            args="--dry-run"
          fi

          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          # docker opens a new SSH connection for every API call, so reuse a single one
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USERNAME
            IdentityFile ~/.ssh/deploy_key
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 60s
          EOF

      - name: Deploy CSZ Bot
        env:
          DOCKER_HOST: ssh://deploy-target
          COMPOSE_FILE: .infra/compose.ephemeral.yaml
          # Must match the project name in e2e-cleanup.yaml
          COMPOSE_PROJECT_NAME: ${{ github.event_name == 'pull_request' && format('csz-bot-pr-{0}', github.event.number) || 'csz-bot-master' }}
          BOT_ARGS: ${{ steps.args.outputs.args }}
          BOT_IMAGE: ${{ needs.build.outputs.image-tag }}
        run: |
          EPHEMERAL_BOT_CONFIG=$(< config-ephemeral.json)
          export EPHEMERAL_BOT_CONFIG

          # All ephemeral bots share the same Discord token, so only one PR bot may run at a time
          for project in $(docker compose ls --all --quiet --filter "name=^csz-bot-pr-"); do
            if [[ "$project" != "$COMPOSE_PROJECT_NAME" ]]; then
              docker compose -p "$project" down
            fi
          done

          docker compose pull bot
          docker compose up -d --remove-orphans

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        if: ${{ github.event_name == 'pull_request' }}
        with:
          comment-tag: discord-invite
          message: |
            Hallo, hier kannst du jetzt deine tolle neue Funktion testen: https://discord.gg/pJjfF6n2ec
